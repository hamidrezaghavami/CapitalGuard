<!-- The main shell of your website where React injects the entire application. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Import Inter Font for that premium terminal feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CDN so all visual classes snap into place instantly -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <title>CapitalGuard Dashboard</title>
    <style>
      /* Prevent white flash before React loads */
      body { background-color: #050810; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite's entry point, make sure this path matches your setup -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
